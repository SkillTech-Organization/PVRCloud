name: Deploy infrastructure of the PVRPCloud 1.5 solution from Azure bicep IaC to Azure

on:
  push:
    branches:
      - devlop15
    paths:
      - 'infrastructure/test_pvrpcloud15_iac.bicep'
  workflow_dispatch:


env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.PRATIX_AZURE_SUBSCRIPTIONID }}
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main15' && 'prod' || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main15' && 'prod' || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.PVRPCLOUD15_IAC_CREDENTIALS }}

    - name: Get Bicep Parameters
      id: bicep-params
      run: |
        # Extract default location from Bicep file
        LOCATION=$(grep "param location string = " ./infrastructure/test_pvrpcloud15_iac.bicep | sed "s/.*= '\(.*\)'/\1/")
        echo "location=$LOCATION" >> $GITHUB_OUTPUT

    - name: Deploy Bicep Template
      uses: azure/arm-deploy@v2
      with:
        subscriptionId: ${{ env.AZURE_SUBSCRIPTION_ID }}
        scope: subscription
        region: ${{ steps.bicep-params.outputs.location }}
        template: ./infrastructure/test_pvrpcloud15_iac.bicep
        parameters: environment=${{ env.ENVIRONMENT }}
        failOnStdErr: false
        deploymentName: 'bicep-deployment-${{ github.run_number }}'
      id: deploy

    - name: Display Deployment Results
      run: |
        echo "==================================="
        echo "Deployment completed successfully!"
        echo "==================================="
        echo "Environment: ${{ steps.deploy.outputs.environment }}"
        echo "Resource Group: ${{ steps.deploy.outputs.resourceGroupName }}"
        echo "Location: ${{ steps.deploy.outputs.location }}"
        echo "Resource Group ID: ${{ steps.deploy.outputs.resourceGroupId }}"
        echo "==================================="

    - name: Azure Logout
      if: always()
      run: az logout